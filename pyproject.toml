[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AsyncTradera"
version = "0.1.0.0"
description = "Async Python wrapper for the Tradera REST API (v4)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "sudoDeVinci" },
]
keywords = ["tradera", "api", "async", "asyncio", "httpx", "marketplace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "respx>=0.22.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/sdvnci/AsyncTradera"
Repository = "https://github.com/sdvnci/AsyncTradera"
Issues = "https://github.com/sdvnci/AsyncTradera/issues"

[tool.hatch.build.targets.wheel]
packages = ["AsyncTradera"]
include = [
    "AsyncTradera/**/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "AsyncTradera/**/*.py",
    "AsyncTradera/**/py.typed",
    "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.black]
target-version = ["py311"]
